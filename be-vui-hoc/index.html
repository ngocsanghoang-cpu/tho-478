<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Happy Learning</title>
  <meta name="description" content="Helps children do things by themselves, practice writing, counting and math, with a gentle voice guide.">
  <meta name="theme-color" content="#fff7e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Happy Learning">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="splash">
  <header id="topbar">
    <button id="homeBtn" class="icon-btn" aria-label="Home">🏠</button>
    <button id="backBtn" class="icon-btn" aria-label="Back">⬅️</button>
    <div id="bubble" role="button" aria-label="Hear again">
      <span class="mascot">🐰</span>
      <span class="title" id="title"></span>
      <span class="say" id="sayText"></span>
    </div>
    <div id="stars" aria-label="Stars"><span>⭐</span><b id="starCount">0</b></div>
  </header>
  <main id="app"></main>
  <div id="overlay"></div>
  <noscript>Happy Learning needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
